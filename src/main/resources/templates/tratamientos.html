<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tratamientos - Clínica Dental</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Menú de navegación común -->
<header class="navbar">
    <a class="logo" th:href="@{/}">🦷 Clínica Dental "K-ries"</a>
    <nav class="navbar-links">
        <a th:href="@{/pacientes}">Pacientes</a>
        <a th:href="@{/tratamientos}" class="active">Tratamientos</a>
        <a th:href="@{/citas}">Citas</a>
        <a th:href="@{/calendario}">Calendario</a>
    </nav>
</header>

<main class="contenedor-tabla">
    <h1>Catálogo de Tratamientos</h1>

    <div th:if="${mensajeExito != null}" class="alerta-exito" th:text="${mensajeExito}"></div>

    <a th:href="@{/tratamientos/nuevo}" class="btn-nuevo">➕ Nuevo Tratamiento</a>

    <table class="tabla-pacientes">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Duración (min)</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tratamientos}">
            <td th:text="${t.id}"></td>
            <td><strong th:text="${t.nombre}"></strong></td>
            <td th:text="${t.descripcion}"></td>
            <td th:text="${#numbers.formatDecimal(t.precio, 1, 2) + ' €'}"></td>
            <td th:text="${t.duracion + ' min'}"></td>
            <td style="white-space: nowrap;">
                <a th:href="@{/tratamientos/editar/{id}(id=${t.id})}" class="btn-accion">✏️ Editar</a>

                <form th:action="@{/tratamientos/eliminar/{id}(id=${t.id})}" method="post" style="display:inline; background:none; padding:0; box-shadow:none;">
                    <button type="submit" class="btn-eliminar" onclick="return confirm('¿Seguro que deseas eliminar este tratamiento?');">
                        🗑️ Eliminar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
