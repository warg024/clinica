<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Tratamiento - Clínica Dental</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="navbar">
    <a class="logo" th:href="@{/pacientes}">🦷 Clínica Dental</a>
    <nav class="navbar-links">
        <a th:href="@{/pacientes}">Pacientes</a>
        <a th:href="@{/tratamientos}" class="active">Tratamientos</a>
        <a th:href="@{/citas}">Citas</a>
    </nav>
</header>

<div class="contenedor-form">
    <h1>Alta de Tratamiento</h1>

    <form th:action="@{/tratamientos/guardar}" th:object="${tratamiento}" method="post">
        <label for="nombre">Nombre del tratamiento:</label>
        <input type="text" id="nombre" th:field="*{nombre}" maxlength="50" required placeholder="Ej: Limpieza Bucal">

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" th:field="*{descripcion}" rows="3" maxlength="250" placeholder="Detalle técnico del procedimiento..."></textarea>

        <label for="precio">Precio (€):</label>
        <input type="number" id="precio" th:field="*{precio}" step="0.01" min="1.00" max="9999.99" required placeholder="0.00">

        <label for="duracion">Duración estimada (minutos):</label>
        <input type="number" id="duracion" th:field="*{duracion}" min="1" required placeholder="30">

        <button type="submit">Guardar Tratamiento</button>
    </form>

    <a th:href="@{/tratamientos}" class="btn-volver">← Volver al listado</a>
</div>

</body>
</html>
